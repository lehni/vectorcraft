[package]
name = "vectorcraft-scriptographer"
description = "Scriptographer: PaperScript and the Paper.js API in VectorCraft, run by V8, the browser's engine or Boa"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["v8", "boa"]
# V8 for desktop builds; on wasm32 scripts run in the browser's engine instead.
v8 = ["dep:v8"]
# Boa, pure Rust, for platforms V8 doesn't support.
boa = ["dep:boa_engine"]

[dependencies]
vectorcraft-color = { workspace = true }
vectorcraft-doc = { workspace = true }
# The app's geometry effects, for what scripts' effects draw.
vectorcraft-effects = { workspace = true }
vectorcraft-geom = { workspace = true }
# Text measuring on the canvas, with the app's fonts and shaping.
vectorcraft-text = { workspace = true }
# The canvas's pixels, and drawing on them, as the app's renderer draws.
vello_cpu = { workspace = true }
# vello_cpu's filters, for shadows and `filter`.
vello_common = { version = "0.2", default-features = false }
# Decoding the images `createImageBitmap()` reads, as the app decodes placed images.
image = { workspace = true }
# Naming each script's `localStorage` file for its path.
sha2 = { version = "0.10", default-features = false }
# The grapheme clusters of `TextMetrics`, as the app's text editing has them.
unicode-segmentation = "1.13"
# `atob` and `btoa`.
vectorcraft-format = { workspace = true }
# Resolving `import` specifiers against modules from the web.
url = "2"
boa_engine = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
# CSS colours for the canvas shim, as the SVG importer parses them.
svgtypes = "0.16"
thiserror = { workspace = true }

[dev-dependencies]
vectorcraft-engine = { workspace = true }
# Effect plug-ins for the tests, from the plug-in crate's templates.
vectorcraft-plugins = { workspace = true }
wat = { workspace = true }
# The tests measure and draw text in the bundled fonts (the workspace leaves turning them on to the
# engine).
vectorcraft-text = { workspace = true, features = ["bundled-fonts"] }
# vello_cpu as the app builds it, with its threads.
vello_cpu = { workspace = true, features = ["multithreading"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
v8 = { workspace = true, optional = true }
# `crypto.getRandomValues()` and `randomUUID()` (src/web.rs; browsers have their own).
getrandom = "0.3"
# `fetch()` and `import` from the web (browsers have their own).
ureq = "3"
# `WebSocket`, over the same rustls (browsers have their own).
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# In browsers, Boa gets the clock and `Math.random()` from JavaScript.
boa_engine = { workspace = true, optional = true, features = ["js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "HtmlIFrameElement", "Node", "Window"] }

